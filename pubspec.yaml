name: flauncher
description: Flutter-based Android TV launcher.

version: 2026.10.03+8112

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  intl: any
  drift: ^2.14.1
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^10.2.2
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  screen_brightness: ^2.1.11
  flutter_localizations:
    sdk: flutter
  pool: ^1.5.2
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  flutter_lints: ^6.0.0
  mockito: ^5.3.2
  drift_dev: ^2.5.2
  transparent_image: ^2.0.1

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any
  flutter_launcher_icons: ^0.14.4

  fake_async: any
flutter_icons:
  android: "ic_launcher"
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    # Onest's SIL Open Font License travels with the font inside the app (OFL condition 2).
    - assets/fonts/Onest/OFL.txt
  fonts:
    # Variable (wght 100 to 900): a FontWeight of any value sets its weight axis.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest/Onest-Variable.ttf
